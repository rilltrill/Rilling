<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OVERRUN" />
    <meta name="description" content="OVERRUN — an arcade on-rails shooter. Blast zombies and dinosaurs." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Overrun</title>
  </head>
  <body>
    <div id="app">
      <!-- Shown while the bundle loads; the opaque game canvas paints over it. -->
      <div id="boot-splash" aria-hidden="true">
        <div class="bs-logo">OVERRUN</div>
        <div class="bs-bar"><i></i></div>
      </div>
      <div id="stage"></div>
      <div id="play-surface"></div>
      <div id="hud-layer"></div>
      <div id="menu-layer"></div>
      <div id="rotate-hint">
        <div class="rotate-logo">OVERRUN</div>
        <div class="rotate-icon">
          <svg class="rotate-arrow" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 8 A42 42 0 0 1 92 50" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
            <path d="M84 40 L92 52 L98 38" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div class="rotate-phone"></div>
        </div>
        <div class="rotate-text">ROTATE YOUR PHONE</div>
        <div class="rotate-sub">OVERRUN plays best in landscape — more room to aim.</div>
        <button id="rotate-dismiss" class="btn">PLAY ANYWAY</button>
      </div>
      <div id="boot-error" hidden></div>
    </div>
    <noscript>OVERRUN needs JavaScript and WebGL.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
