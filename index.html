<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OVERRUN" />
    <meta name="description" content="OVERRUN — an arcade on-rails shooter. Blast zombies and dinosaurs." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Overrun</title>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="play-surface"></div>
      <div id="hud-layer"></div>
      <div id="menu-layer"></div>
      <div id="rotate-hint">
        <div class="rotate-phone"></div>
        <div class="rotate-text">ROTATE YOUR PHONE</div>
        <div class="rotate-sub">OVERRUN plays best in landscape</div>
        <button id="rotate-dismiss" class="btn">PLAY ANYWAY</button>
      </div>
      <div id="boot-error" hidden></div>
    </div>
    <noscript>OVERRUN needs JavaScript and WebGL.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
