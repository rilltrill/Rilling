# Publishes the game to GitHub Pages so it can be played — and installed to the
# home screen — from iPhone Safari. One-time setup: repo Settings → Pages →
# Source: "GitHub Actions". To deploy from the feature branch too, allow it in
# Settings → Environments → github-pages → Deployment branches.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/arcade-rail-shooter]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vite base is './', so the build works under https://<user>.github.io/<repo>/.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### OVERRUN is live" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "On iPhone: open it in Safari → Share → Add to Home Screen." >> "$GITHUB_STEP_SUMMARY"
