<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    OVERRUN app icon. Full-bleed square: iOS / Android apply their own corner
    masks. scripts/gen-icons.mjs renders every PNG icon / splash from this file
    and scales the <g id="fg"> group for maskable icons, so keep the
    foreground inside that group and within ~200 px of the centre.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="54%" r="62%">
      <stop offset="0" stop-color="#7a120b"/>
      <stop offset=".45" stop-color="#2a0607"/>
      <stop offset="1" stop-color="#07080c"/>
    </radialGradient>
    <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="430">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset=".45" stop-color="#ffa13b"/>
      <stop offset="1" stop-color="#d4140e"/>
    </linearGradient>
    <radialGradient id="dot" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffd0a0"/>
      <stop offset=".5" stop-color="#ff3b2b"/>
      <stop offset="1" stop-color="#9c0b08"/>
    </radialGradient>
  </defs>
  <rect id="bgrect" width="512" height="512" fill="url(#bg)"/>
  <g id="fg">
    <!-- claw slashes behind the sight -->
    <g fill="#000" fill-opacity=".5">
      <path d="M356 62 L282 262 L184 458 L256 256 Z"/>
      <path d="M410 94 L336 282 L238 476 L308 276 Z"/>
      <path d="M302 40 L230 238 L134 426 L204 234 Z"/>
    </g>
    <!-- sight: drop shadows first, then the hot gradient strokes -->
    <g stroke="#000" stroke-opacity=".55" stroke-width="42" stroke-linecap="round" fill="none">
      <circle cx="256" cy="256" r="146"/>
      <line x1="256" y1="70" x2="256" y2="160"/>
      <line x1="256" y1="352" x2="256" y2="442"/>
      <line x1="70" y1="256" x2="160" y2="256"/>
      <line x1="352" y1="256" x2="442" y2="256"/>
    </g>
    <g stroke="url(#t)" stroke-width="26" stroke-linecap="round" fill="none">
      <circle cx="256" cy="256" r="146"/>
      <line x1="256" y1="70" x2="256" y2="160"/>
      <line x1="256" y1="352" x2="256" y2="442"/>
      <line x1="70" y1="256" x2="160" y2="256"/>
      <line x1="352" y1="256" x2="442" y2="256"/>
    </g>
    <circle cx="256" cy="256" r="24" fill="url(#dot)"/>
    <!-- blood drip off the bottom of the ring -->
    <path d="M300 393 C 302 410 306 418 306 430 C 306 440 296 442 294 432 C 292 420 296 408 294 396 Z" fill="#c8120c"/>
  </g>
</svg>
